openapi: 3.0.3
info:
  title: Lend loans service
  version: 1.0.0
  description: >-
    Owns the members and loans tables. Catalog calls GET /loans?tool_id= on
    this service before it retires a tool. Every endpoint can also answer 503
    with an Error body when this service's own database is unavailable.
servers:
  - url: http://localhost:8002
    description: Local docker compose. Deployed URLs come from configuration.
paths:
  /health:
    get:
      summary: Health of this service and its own database
      operationId: getHealth
      responses:
        "200":
          description: The service can read and write its own database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database cannot be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /members:
    get:
      summary: List members, ordered by name
      operationId: listMembers
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      summary: Register a member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMember"
      responses:
        "201":
          description: The member was registered. The email is stored in lower case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Name or email is missing, or the email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /loans:
    get:
      summary: List open loans. Called by the catalog service.
      operationId: listOpenLoans
      parameters:
        - name: tool_id
          in: query
          required: false
          description: Only loans of this tool.
          schema:
            type: integer
      responses:
        "200":
          description: Loans that have not been returned, oldest due date first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      summary: Lend a tool to a member for 7 days
      description: >-
        Asks the catalog service (GET /tools/{tool_id}) whether the tool exists
        and is not retired, with a timeout. If catalog does not answer, nothing
        is written.
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLoan"
      responses:
        "201":
          description: The loan was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedId"
        "400":
          description: tool_id or member_id is missing or not a number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no member with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The tool does not exist, is retired, or is already out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The catalog service or this service's database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /loans/history:
    get:
      summary: List returned loans, newest return first
      operationId: listLoanHistory
      responses:
        "200":
          description: Loans that have been returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryLoan"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /loans/{loan_id}/return:
    post:
      summary: Return a tool
      operationId: returnLoan
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: The loan is closed. Returning a returned loan is a no-op.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedId"
        "404":
          description: There is no loan with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /loans/{loan_id}/repeat:
    post:
      summary: Lend the same tool to the same member for another 7 days
      description: >-
        Creates a new loan from a returned one. Asks the catalog service
        whether the tool is still available, with a timeout.
      operationId: repeatLoan
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "201":
          description: The new loan was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedId"
        "404":
          description: There is no loan, or no member, with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The old loan is still open, or the tool is retired or already out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The catalog service or this service's database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    LoanId:
      name: loan_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    DatabaseUnavailable:
      description: This service's database is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Member:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
    NewMember:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
    Loan:
      type: object
      required: [id, tool_id, member_id, member_name, borrowed_at, due_at, overdue]
      properties:
        id:
          type: integer
        tool_id:
          type: integer
          description: Id of a tool in the catalog service. There is no foreign key across the seam.
        member_id:
          type: integer
        member_name:
          type: string
        borrowed_at:
          type: string
          description: ISO 8601 timestamp in UTC.
        due_at:
          type: string
          description: ISO 8601 timestamp in UTC, 7 days after borrowed_at.
        overdue:
          type: boolean
    HistoryLoan:
      type: object
      required: [id, tool_id, member_id, member_name, borrowed_at, due_at, returned_at]
      properties:
        id:
          type: integer
        tool_id:
          type: integer
        member_id:
          type: integer
        member_name:
          type: string
        borrowed_at:
          type: string
        due_at:
          type: string
        returned_at:
          type: string
    NewLoan:
      type: object
      required: [tool_id, member_id]
      properties:
        tool_id:
          type: integer
        member_id:
          type: integer
    CreatedId:
      type: object
      required: [id]
      properties:
        id:
          type: integer
    Health:
      type: object
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          description: Value of GIT_SHA, or dev.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
