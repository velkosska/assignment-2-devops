name: CI

on:
  push:
  pull_request:

# A newer push cancels the older run of the same branch, except on main: cancelling
# a run in the middle of a deployment could leave Azure half updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/lend

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, loans]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate the OpenAPI document
        run: openapi-spec-validator openapi.yaml

      # A throwaway SQL Server for this job only. The SA password is generated
      # here and masked, so no database password lives in the repo or in secrets.
      - name: Start SQL Server
        run: |
          PW="Ci-$(openssl rand -hex 12)-Aa1"
          echo "::add-mask::$PW"
          echo "MSSQL_SA_PASSWORD=$PW" >> "$GITHUB_ENV"
          docker run -d --name sqlserver -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$PW" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 40); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" \
                 -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready after $attempt checks"
              exit 0
            fi
            sleep 3
          done
          docker logs sqlserver
          exit 1

      - name: Test with coverage
        run: |
          export TEST_DATABASE_URL="mssql://sa:${MSSQL_SA_PASSWORD}@localhost:1433/${{ matrix.service }}_test"
          pytest --cov=. --cov-report=term-missing

  # Cross-seam tests against the real compose stack: both services, SQL Server and
  # real HTTP between them. No registry or Azure access, and no stored secrets.
  integration:
    name: integration (compose stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Lint
        run: |
          ruff check tests/integration
          ruff format --check tests/integration

      # Random passwords for this run only, masked in the logs. The characters are
      # URL-safe and quote-free, as the compose file and db/init.sql expect.
      # .env is git-ignored and disappears with the runner.
      - name: Write .env with random passwords
        run: |
          for name in MSSQL_SA_PASSWORD CATALOG_DB_PASSWORD LOANS_DB_PASSWORD; do
            value="Ci-$(openssl rand -hex 12)-Aa1"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done

      - name: Start the stack
        run: docker compose up --build -d
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Run the cross-seam tests
        run: pytest tests/integration -v
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Show the service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # system.yaml must follow the provided schema and tell the truth about the code.
  # Pure files, no database, no Azure and no secrets.
  system:
    name: system.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/system/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/system/requirements.txt

      - name: Lint
        run: |
          ruff check tests/system
          ruff format --check tests/system

      - name: Validate system.yaml against the schema and the code
        run: pytest tests/system -v

  images:
    name: images (${{ matrix.service }})
    needs: [test, integration, system]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [catalog, loans]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Pushed ${IMAGE_PREFIX}-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built ${{ matrix.service }} without pushing (not a push to main)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # CD, step 1: deploy the images that `images` just pushed for this commit.
  # Runs only on a push to main and only after test, integration, system and images
  # passed for the same commit (needs). Pull requests never reach Azure.
  deploy-services:
    name: deploy services
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job ask GitHub for the OpenID Connect token Azure trusts
      contents: read
    # One deployment at a time, and a newer push waits instead of cancelling a half-done one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Names, not secrets. tests/system checks that they match system.yaml.
    env:
      PREFIX: mvelkoska
      RESOURCE_GROUP: rg-mvelkoska
      UI_STORAGE_ACCOUNT: mvelkoska
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
    steps:
      # No Azure password anywhere: the managed identity mvelkoska-github trusts only
      # runs on main of this repository. Do not add `environment:` to this job, it would
      # change the token's subject and Azure would refuse the sign-in.
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy catalog and loans
        env:
          CATALOG_DB_URL: ${{ secrets.CATALOG_DB_URL }}
          LOANS_DB_URL: ${{ secrets.LOANS_DB_URL }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}"

          # The only origin the services accept calls from: the UI's static website.
          ui_origin="$(az storage account show -g "$RESOURCE_GROUP" -n "$UI_STORAGE_ACCOUNT" \
            --query primaryEndpoints.web -o tsv)"
          ui_origin="${ui_origin%/}"

          # The services find each other through these URLs, read from Azure so they are
          # never hardcoded.
          fqdn() {
            az containerapp show -g "$RESOURCE_GROUP" -n "${PREFIX}-$1" \
              --query properties.configuration.ingress.fqdn -o tsv
          }
          catalog_url="https://$(fqdn catalog)"
          loans_url="https://$(fqdn loans)"

          # deploy <service> <database url> [VAR=value ...]
          deploy() {
            local service="$1" db_url="$2"
            shift 2
            local app="${PREFIX}-${service}"
            # The database URL becomes a Container Apps secret. The app only ever sees
            # a reference to it (secretref:), never a plain environment variable.
            az containerapp secret set -g "$RESOURCE_GROUP" -n "$app" \
              --secrets "database-url=${db_url}" -o none
            # The image is tagged with this commit, so Azure runs exactly what CI tested.
            # Replica limits are set on every deploy: scale to zero, at most one replica,
            # so a migration at startup never runs twice at once.
            az containerapp update -g "$RESOURCE_GROUP" -n "$app" \
              --image "${registry}/lend-${service}:${GITHUB_SHA}" \
              --min-replicas 0 --max-replicas 1 \
              --replace-env-vars PORT=8000 DATABASE_URL=secretref:database-url \
                ALLOWED_ORIGIN="$ui_origin" GIT_SHA="$GITHUB_SHA" "$@" -o none
            echo "Deployed ${registry}/lend-${service}:${GITHUB_SHA} to ${app}" >> "$GITHUB_STEP_SUMMARY"
          }

          # 10 seconds, not 2: the other service may be scaled to zero and needs time to start.
          deploy catalog "$CATALOG_DB_URL" LOANS_URL="$loans_url" LOANS_TIMEOUT_S=10
          deploy loans "$LOANS_DB_URL" CATALOG_URL="$catalog_url" CATALOG_TIMEOUT_S=10

  # CD, step 2: publish the UI to the storage account's static website, pointed at the two
  # services that deploy-services has just updated. Same rules as above: main only, and the
  # same OpenID Connect sign-in, so there is still no Azure password anywhere.
  deploy-ui:
    name: deploy ui
    needs: [deploy-services]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Names, not secrets. tests/system checks that they match system.yaml.
    env:
      PREFIX: mvelkoska
      RESOURCE_GROUP: rg-mvelkoska
      UI_STORAGE_ACCOUNT: mvelkoska
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish the UI
        run: |
          set -euo pipefail

          # The UI is static files, so it learns where the services are from config.js.
          # The addresses are read from Azure, not hardcoded, and written into a copy of
          # ui/: the committed config.js (localhost, for docker compose) is never changed.
          fqdn() {
            az containerapp show -g "$RESOURCE_GROUP" -n "${PREFIX}-$1" \
              --query properties.configuration.ingress.fqdn -o tsv
          }
          site="${RUNNER_TEMP}/site"
          cp -R ui "$site"
          cat > "${site}/config.js" <<CONFIG
          window.CONFIG = {
            CATALOG_URL: "https://$(fqdn catalog)",
            LOANS_URL: "https://$(fqdn loans)",
          };
          CONFIG

          # The identity is Contributor on the resource group, which lets it read the
          # storage account key (no key is stored anywhere) but not hold a blob data role.
          # no-cache so a visitor never keeps an old page next to a new API.
          az storage blob upload-batch \
            --account-name "$UI_STORAGE_ACCOUNT" --auth-mode key \
            --destination "\$web" --source "$site" \
            --overwrite true --content-cache-control "no-cache" -o none

          url="$(az storage account show -g "$RESOURCE_GROUP" -n "$UI_STORAGE_ACCOUNT" \
            --query primaryEndpoints.web -o tsv)"
          echo "Published the UI to ${url}" >> "$GITHUB_STEP_SUMMARY"

  # CD, step 3: prove that what is running is what was just deployed. Without this a deploy
  # that starts a broken app, or leaves an older revision serving, would still look green.
  verify:
    name: verify deployment
    needs: [deploy-services, deploy-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    # Names, not secrets. tests/system checks that they match system.yaml.
    env:
      PREFIX: mvelkoska
      RESOURCE_GROUP: rg-mvelkoska
      UI_STORAGE_ACCOUNT: mvelkoska
      # Seconds to wait for each service. A service scaled to zero has to start its
      # container and wake a paused database, which takes about a minute.
      HEALTH_WAIT_S: 600
    steps:
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check the services and the UI
        run: |
          set -euo pipefail

          fqdn() {
            az containerapp show -g "$RESOURCE_GROUP" -n "${PREFIX}-$1" \
              --query properties.configuration.ingress.fqdn -o tsv
          }
          catalog_url="https://$(fqdn catalog)"
          loans_url="https://$(fqdn loans)"
          ui_url="$(az storage account show -g "$RESOURCE_GROUP" -n "$UI_STORAGE_ACCOUNT" \
            --query primaryEndpoints.web -o tsv)"
          ui_url="${ui_url%/}"

          tmp="$(mktemp -d)"
          failed=0
          {
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Asks /health until the service answers 200 with its database ok, the version
          # of this commit, and CORS open for the UI and nobody else. The version check is
          # what proves the new revision is the one serving.
          wait_for_health() {
            local name="$1" url="$2" started=$SECONDS
            until curl -fsS --max-time 30 -D "$tmp/headers" -o "$tmp/body" \
                -H "Origin: ${ui_url}" "${url}/health" 2> "$tmp/error" \
              && jq -e --arg sha "$GITHUB_SHA" \
                '.status == "ok" and .db == "ok" and .version == $sha' "$tmp/body" > /dev/null \
              && tr -d '\r' < "$tmp/headers" \
                | grep -iFxq "access-control-allow-origin: ${ui_url}"; do
              if [ $((SECONDS - started)) -ge "$HEALTH_WAIT_S" ]; then
                echo "::error::${name} is not healthy on ${GITHUB_SHA} after ${HEALTH_WAIT_S}s"
                cat "$tmp/error" "$tmp/body" 2> /dev/null || true
                echo "| ${name} | not healthy on \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi
              echo "${name} is not ready yet ($((SECONDS - started))s), asking again"
              sleep 5
            done
            echo "${name}: $(cat "$tmp/body")"
            echo "| ${name} | healthy, version \`$(jq -r .version "$tmp/body")\`, CORS only for the UI |" >> "$GITHUB_STEP_SUMMARY"
          }

          # The page is served and its config.js points at these two services.
          check_ui() {
            if curl -fsS --max-time 30 "${ui_url}/index.html" | grep -q "Lend" \
              && curl -fsS --max-time 30 "${ui_url}/config.js" \
                | grep -Fq "$catalog_url" \
              && curl -fsS --max-time 30 "${ui_url}/config.js" \
                | grep -Fq "$loans_url"; then
              echo "ui: served, config.js points at both services"
              echo "| ui | served, \`config.js\` points at both services |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::the UI at ${ui_url} is missing or does not point at the services"
              echo "| ui | missing or wrong \`config.js\` |" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          check_ui || failed=1
          wait_for_health catalog "$catalog_url" || failed=1
          wait_for_health loans "$loans_url" || failed=1
          exit "$failed"
